# svodka configuration. Edit this file (GitHub web editor works fine).
# Secrets are NOT stored here — set them as GitHub Actions Secrets (see README.md).

# Chats to read. Replace with your own. Use @username or t.me/<name> links.
source_chats: []
# Example:
# source_chats:
#   - "@my_team_chat"
#   - "https://t.me/some_channel"

# "me" posts to your Saved Messages (safe preview). Set to "@yourgroup" to go live.
target_chat: "me"

# Optional: send digests of different chats to different targets in one run. When
# `routes` is set, the source_chats/target_chat above are ignored; the settings
# below (window, language, model, ...) stay global. Omit for one digest (default).
# routes:
#   - target_chat: "@team_one"
#     source_chats: ["@chat_a", "@chat_b"]
#   - target_chat: "@team_two"
#     source_chats: ["@chat_c"]

window_hours: 24
output_lang: "ru"
timezone: "UTC"

# LLM model (cheaper <-> better):
#   claude-haiku-4-5   - cheapest & fastest, fine for most digests
#   claude-sonnet-4-6  - balanced quality/cost (default)
#   claude-opus-4-8    - highest quality, most expensive
model: "claude-sonnet-4-6"
max_output_tokens: 2000

# Optional free-text instructions appended to the digest prompt (tone, structure,
# what to emphasize). Leave empty/omitted for default behavior.
# extra_instructions: "Start with a one-line TL;DR, then group items by topic."

# Add t.me/c source links to digest items (channels/supergroups only; a private
# link opens only for chat members). Default true; set to false to disable.
backlinks: true
