# svodka configuration (non-secret settings).
# Secrets (api_id, api_hash, session, Anthropic key) live in GitHub Actions
# Secrets, NOT here. See README.md.

# Chats to read. Use @username or a t.me/<name> link (recommended).
# Private chats without a username can be referenced by numeric id.
source_chats:
  - "@durov"
  - "https://t.me/telegram"

# Where to post the digest.
#   "me"      -> your Saved Messages (safe preview; the default)
#   "@group"  -> a group/channel you can post to (go live)
target_chat: "me"

# Optional: fan out several digests in one run — different source chats to
# different target chats. When `routes` is set, the top-level source_chats /
# target_chat above are ignored; all other settings below stay global (shared by
# every route). Leave `routes` out for the default single-digest behavior.
# routes:
#   - target_chat: "@team_one"
#     source_chats:
#       - "@chat_a"
#       - "@chat_b"
#   - target_chat: "@team_two"   # omit or "" -> Saved Messages
#     source_chats:
#       - "@chat_c"

# How far back to read, in hours.
window_hours: 24

# Output language of the digest (e.g. ru, en).
output_lang: "ru"

# IANA timezone used for date wording in the digest header.
timezone: "Europe/Belgrade"

# LLM provider: "anthropic" (default) or "openrouter" (one key, many models via
# OpenRouter's OpenAI-compatible API; needs the SVODKA_OPENROUTER_KEY secret).
# llm_provider: openrouter
# model: "openai/gpt-5"        # required for openrouter, "vendor/model" slug

# Anthropic model id (cheaper <-> better):
#   claude-haiku-4-5   - cheapest & fastest, fine for most digests
#   claude-sonnet-4-6  - balanced quality/cost (default)
#   claude-opus-4-8    - highest quality, most expensive
model: "claude-sonnet-4-6"
# Output token budget for the summary.
max_output_tokens: 2000

# Optional free-text instructions appended to the digest prompt (tone, structure,
# what to emphasize). Leave empty/omitted for default behavior. The Telegram
# formatting rules (plain text, bullets) still take precedence.
# extra_instructions: "Start with a one-line TL;DR, then group items by topic."

# Add t.me/c source links to digest items so you can jump to the original
# message (channels/supergroups only; a private link opens only for chat members).
# Default true; set to false to disable.
backlinks: true
